<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>右手骨骼识别 · WebGPU 双模型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0a0e1a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    min-height: 100vh;
  }
  .header {
    width: 100%;
    text-align: center;
    margin-bottom: 10px;
    max-width: 720px;
  }
  .header h1 {
    font-size: 18px;
    background: linear-gradient(135deg, #00d9ff, #0078ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .header .sub {
    font-size: 11px;
    color: #666;
    letter-spacing: 0.5px;
  }
  .container {
    position: relative;
    width: 100%;
    max-width: 720px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 50px rgba(0, 217, 255, 0.18), 0 0 0 1px rgba(0, 217, 255, 0.1) inset;
  }
  video, canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .mirror video, .mirror canvas { transform: scaleX(-1); }
  .controls {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 720px;
  }
  button {
    background: linear-gradient(135deg, #00d9ff, #0078ff);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 500;
    min-width: 90px;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(0, 217, 255, 0.4);
  }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled {
    background: #1a1f2e;
    color: #555;
    cursor: not-allowed;
  }
  button.secondary {
    background: linear-gradient(135deg, #2a3040, #1a1f2e);
  }
  .status {
    margin-top: 10px;
    padding: 9px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(0,217,255,0.18);
    border-radius: 6px;
    font-size: 12px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    text-align: center;
    max-width: 720px;
    width: 100%;
    word-break: break-word;
  }
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.78);
    z-index: 10;
    flex-direction: column;
    gap: 12px;
    backdrop-filter: blur(4px);
  }
  .spinner {
    width: 42px;
    height: 42px;
    border: 3px solid rgba(0, 217, 255, 0.18);
    border-top-color: #00d9ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .info-bar {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 5px;
    font-family: "SF Mono", Monaco, monospace;
    z-index: 5;
    border: 1px solid rgba(0,217,255,0.25);
    white-space: nowrap;
    max-width: calc(100% - 20px);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 217, 255, 0.18);
    color: #00d9ff;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 5px;
    font-family: "SF Mono", Monaco, monospace;
    z-index: 5;
    border: 1px solid rgba(0,217,255,0.4);
  }
  .legend {
    margin-top: 10px;
    display: flex;
    gap: 14px;
    font-size: 11px;
    color: #888;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 720px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<div class="header">
  <h1>🦴 右手骨骼识别系统</h1>
  <div class="sub">WebGPU 加速 · 双模型并行 · 21 关键点 + 骨骼连线 · 抗自遮挡</div>
</div>

<div class="container" id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="info-bar hidden" id="infoBar"></div>
  <div class="badge hidden" id="badge">RIGHT HAND</div>
  <div class="loading hidden" id="loading">
    <div class="spinner"></div>
    <div id="loadingText">加载中...</div>
  </div>
</div>

<div class="controls">
  <button id="startBtn">▶ 启动</button>
  <button id="switchBtn" disabled class="secondary">🔄 切换摄像头</button>
  <button id="stopBtn" disabled class="secondary">⏹ 停止</button>
</div>

<div class="status" id="status">状态: 待启动 · 仅识别右手</div>

<div class="legend">
  <span><span class="dot" style="background:#ffaa00"></span>手腕(0)</span>
  <span><span class="dot" style="background:#ff3366"></span>指尖</span>
  <span><span class="dot" style="background:#00ff88"></span>关节</span>
  <span><span class="dot" style="background:#00d9ff"></span>近</span>
  <span><span class="dot" style="background:#c800ff"></span>远</span>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ===================== DOM 元素 =====================
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startBtn = document.getElementById("startBtn");
const switchBtn = document.getElementById("switchBtn");
const stopBtn = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");
const container = document.getElementById("container");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");
const infoBar = document.getElementById("infoBar");
const badge = document.getElementById("badge");

// ===================== 状态变量 =====================
let stream = null;
let facingMode = "user";            // 默认前置摄像头
let handLandmarker1 = null;         // 模型 1: 高阈值, 高精度
let handLandmarker2 = null;         // 模型 2: 低阈值, 抗遮挡/极端角度
let running = false;
let lastVideoTime = -1;
let smoothedLandmarks = null;       // 平滑后的关键点 (用于遮挡时保持)
let lostCounter = 0;                // 连续丢失帧数
let fpsCounter = { count: 0, lastTime: performance.now(), fps: 0 };

// ===================== 骨骼连线定义 (21 点) =====================
// 参考 MediaPipe Hand Topology
const HAND_CONNECTIONS = [
  // 拇指
  [0, 1], [1, 2], [2, 3], [3, 4],
  // 食指
  [0, 5], [5, 6], [6, 7], [7, 8],
  // 中指
  [9, 10], [10, 11], [11, 12],
  // 无名指
  [13, 14], [14, 15], [15, 16],
  // 小指
  [0, 17], [17, 18], [18, 19], [19, 20],
  // 手掌
  [5, 9], [9, 13], [13, 17]
];

// ===================== 工具函数 =====================
function setStatus(msg) {
  statusEl.textContent = "状态: " + msg;
  console.log("[Status]", msg);
}

function showLoading(text) {
  loadingText.textContent = text;
  loading.classList.remove("hidden");
}

function hideLoading() {
  loading.classList.add("hidden");
}

// 检测 WebGPU 是否可用
async function checkWebGPU() {
  if (!navigator.gpu) return false;
  try {
    const adapter = await navigator.gpu.requestAdapter();
    return !!adapter;
  } catch (e) {
    return false;
  }
}

// ===================== 模型加载 =====================
async function loadModels() {
  showLoading("正在加载 WASM 运行时...");
  setStatus("加载运行时...");

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  showLoading("检测 WebGPU 支持...");
  const hasWebGPU = await checkWebGPU();
  setStatus(hasWebGPU ? "WebGPU 已启用,加载模型..." : "WebGPU 不可用,降级 GPU/WebGL...");

  // 官方公开模型 (float16, 体积小, 速度快)
  const modelUrl = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  const delegate = hasWebGPU ? "GPU" : "CPU";

  // 模型 1: 高阈值 - 主检测, 高置信度结果
  showLoading("加载模型 1/2 (高精度)...");
  handLandmarker1 = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: modelUrl,
      delegate: delegate
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.6,
    minHandPresenceConfidence: 0.6,
    minTrackingConfidence: 0.6
  });

  // 模型 2: 低阈值 - 用于极端角度与自遮挡场景的兜底检测
  showLoading("加载模型 2/2 (低阈值抗遮挡)...");
  handLandmarker2 = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: modelUrl,
      delegate: delegate
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.3,
    minHandPresenceConfidence: 0.3,
    minTrackingConfidence: 0.3
  });

  hideLoading();
  setStatus("✅ 双模型加载完成 (WebGPU: " + (hasWebGPU ? "ON" : "OFF") + ")");
}

// ===================== 摄像头控制 =====================
async function startCamera() {
  try {
    startBtn.disabled = true;
    showLoading("请求摄像头权限...");

    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    await new Promise((resolve, reject) => {
      video.onloadedmetadata = () => {
        video.play().then(resolve).catch(reject);
      };
      setTimeout(() => reject(new Error("视频加载超时")), 8000);
    });

    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;

    // 前置摄像头镜像显示 (符合用户直觉)
    if (facingMode === "user") {
      container.classList.add("mirror");
    } else {
      container.classList.remove("mirror");
    }

    if (!handLandmarker1) {
      await loadModels();
    }

    running = true;
    startBtn.disabled = true;
    switchBtn.disabled = false;
    stopBtn.disabled = false;
    infoBar.classList.remove("hidden");
    badge.classList.remove("hidden");
    badge.textContent = "RIGHT HAND · " + (facingMode === "user" ? "前置" : "后置");
    setStatus("🟢 运行中 · " + (facingMode === "user" ? "前置摄像头" : "后置摄像头"));

    detectLoop();
  } catch (e) {
    hideLoading();
    startBtn.disabled = false;
    setStatus("❌ 启动失败: " + (e.message || e));
    console.error(e);
  }
}

function stopCamera() {
  running = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  startBtn.disabled = false;
  switchBtn.disabled = true;
  stopBtn.disabled = true;
  infoBar.classList.add("hidden");
  badge.classList.add("hidden");
  smoothedLandmarks = null;
  setStatus("⏹ 已停止");
}

async function switchCamera() {
  facingMode = facingMode === "user" ? "environment" : "user";
  smoothedLandmarks = null;
  setStatus("🔄 切换到 " + (facingMode === "user" ? "前置" : "后置") + "...");
  await startCamera();
}

// ===================== 平滑滤波 (处理自遮挡) =====================
// 当某一帧检测不到手时, 短时间内保持上一帧的关键点
function smoothLandmarks(newLandmarks) {
  if (!newLandmarks || newLandmarks.length === 0) {
    lostCounter++;
    // 连续丢失超过 10 帧 (约 300ms@30fps) 才真正清除
    if (lostCounter > 10) {
      smoothedLandmarks = null;
      return null;
    }
    return smoothedLandmarks;
  }
  lostCounter = 0;

  if (!smoothedLandmarks || smoothedLandmarks.length !== newLandmarks.length) {
    smoothedLandmarks = newLandmarks.map(p => ({ x: p.x, y: p.y, z: p.z || 0 }));
    return smoothedLandmarks;
  }

  // 指数平滑 (EMA)
  const alpha = 0.65;
  for (let i = 0; i < newLandmarks.length; i++) {
    smoothedLandmarks[i].x = smoothedLandmarks[i].x * (1 - alpha) + newLandmarks[i].x * alpha;
    smoothedLandmarks[i].y = smoothedLandmarks[i].y * (1 - alpha) + newLandmarks[i].y * alpha;
    smoothedLandmarks[i].z = (smoothedLandmarks[i].z || 0) * (1 - alpha) + (newLandmarks[i].z || 0) * alpha;
  }
  return smoothedLandmarks;
}

// ===================== 右手筛选 + 双模型融合 =====================
function pickRightHand(results1, results2) {
  const candidates = [];

  for (const result of [results1, results2]) {
    if (!result || !result.landmarks || result.landmarks.length === 0) continue;

    for (let i = 0; i < result.landmarks.length; i++) {
      const handed = result.handednesses?.[i]?.[0];
      const label = handed?.categoryName || "Unknown";
      const score = handed?.score || 0;

      // ★ 镜像补偿 ★
      // MediaPipe 假设输入图像是"已镜像的自拍图"
      // 但 getUserMedia 拿到的原始帧未镜像 (我们只用 CSS 镜像显示)
      // 因此前置摄像头 (user) 时, MediaPipe 看到的实际是"非镜像自拍图", 左右标签需互换
      // 后置摄像头 (environment) 不需要互换
      let effectiveLabel = label;
      if (facingMode === "user") {
        effectiveLabel = label === "Right" ? "Left" : (label === "Left" ? "Right" : label);
      }

      if (effectiveLabel === "Right") {
        candidates.push({
          landmarks: result.landmarks[i],
          worldLandmarks: result.worldLandmarks?.[i],
          score: score,
          modelIdx: result === results1 ? 1 : 2
        });
      }
    }
  }

  if (candidates.length === 0) return null;

  // 按置信度排序
  candidates.sort((a, b) => b.score - a.score);

  // 如果两个模型都检测到右手 -> 取平均, 提升精度
  if (candidates.length >= 2 && candidates[0].modelIdx !== candidates[1].modelIdx) {
    const c1 = candidates[0];
    const c2 = candidates[1];
    const merged = [];
    for (let j = 0; j < c1.landmarks.length; j++) {
      merged.push({
        x: (c1.landmarks[j].x + c2.landmarks[j].x) / 2,
        y: (c1.landmarks[j].y + c2.landmarks[j].y) / 2,
        z: ((c1.landmarks[j].z || 0) + (c2.landmarks[j].z || 0)) / 2
      });
    }
    return { landmarks: merged, score: Math.max(c1.score, c2.score), merged: true };
  }

  return candidates[0];
}

// ===================== 骨骼绘制 =====================
function drawSkeleton(landmarks) {
  if (!landmarks) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }

  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  // === 1. 骨骼连线 (按深度排序, 远的先画) ===
  ctx.lineWidth = 5;
  ctx.lineCap = "round";

  const connections = HAND_CONNECTIONS.map(([s, e]) => {
    const z = ((landmarks[s].z || 0) + (landmarks[e].z || 0)) / 2;
    return { s, e, z };
  }).sort((a, b) => a.z - b.z); // z 小 = 近相机, 最后画

  for (const { s, e, z } of connections) {
    const p1 = landmarks[s];
    const p2 = landmarks[e];

    // 深度颜色: 近=青色, 远=紫色
    const depth = Math.max(-0.15, Math.min(0.15, z));
    const t = (depth + 0.15) / 0.3; // 0 (近) ~ 1 (远)
    const r = Math.round(0 + t * 200);
    const g = Math.round(217 - t * 217);
    const b = 255;

    ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.92)`;
    ctx.shadowColor = `rgba(${r}, ${g}, ${b}, 0.55)`;
    ctx.shadowBlur = 10;

    ctx.beginPath();
    ctx.moveTo(p1.x * w, p1.y * h);
    ctx.lineTo(p2.x * w, p2.y * h);
    ctx.stroke();
  }

  ctx.shadowBlur = 0;

  // === 2. 关节点 ===
  for (let i = 0; i < landmarks.length; i++) {
    const p = landmarks[i];
    const x = p.x * w;
    const y = p.y * h;
    const z = p.z || 0;

    const isTip = [4, 8, 12, 16, 20].includes(i);
    const isWrist = i === 0;
    const radius = isWrist ? 10 : (isTip ? 7 : 5);

    // 深度颜色 (指尖红, 手腕橙, 关节青-紫渐变)
    const depth = Math.max(-0.15, Math.min(0.15, z));
    const t = (depth + 0.15) / 0.3;
    let color;
    if (isWrist) color = "#ffaa00";
    else if (isTip) color = "#ff3366";
    else color = `rgb(${Math.round(0 + t * 200)}, ${Math.round(255 - t * 200)}, 255)`;

    // 光晕
    ctx.beginPath();
    ctx.arc(x, y, radius + 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
    ctx.fill();

    // 实心点
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    // 白色描边
    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // === 3. 手掌中心标注 ===
  const palmCenter = landmarks[0]; // 手腕作为参考
  if (palmCenter) {
    ctx.font = "bold 14px monospace";
    ctx.fillStyle = "rgba(0, 217, 255, 0.95)";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    // 由于容器 CSS 镜像, 文字会被镜像, 这里我们反向绘制保持文字正常
    if (facingMode === "user") {
      ctx.save();
      ctx.translate(palmCenter.x * w + 15, palmCenter.y * h + 15);
      ctx.scale(-1, 1);
      ctx.fillText("RIGHT HAND", 0, 0);
      ctx.restore();
    } else {
      ctx.fillText("RIGHT HAND", palmCenter.x * w + 15, palmCenter.y * h + 15);
    }
  }
}

// ===================== 检测主循环 =====================
async function detectLoop() {
  if (!running) return;

  const now = performance.now();

  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime;

    try {
      // 并行运行两个模型 (由于 detectForVideo 是同步的 GPU 推理, 这里串行调用即可)
      const results1 = handLandmarker1.detectForVideo(video, now);
      const results2 = handLandmarker2.detectForVideo(video, now + 1);

      // 右手筛选 + 融合
      const rightHand = pickRightHand(results1, results2);
      const smoothed = smoothLandmarks(rightHand?.landmarks);

      // FPS 计算
      fpsCounter.count++;
      const elapsed = now - fpsCounter.lastTime;
      if (elapsed >= 500) {
        fpsCounter.fps = Math.round(fpsCounter.count * 1000 / elapsed);
        fpsCounter.count = 0;
        fpsCounter.lastTime = now;
      }

      const handCount1 = results1.landmarks?.length || 0;
      const handCount2 = results2.landmarks?.length || 0;

      if (smoothed) {
        drawSkeleton(smoothed);
        infoBar.textContent = `FPS:${fpsCounter.fps} | M1:${handCount1}手 M2:${handCount2}手 | 右手✓ ${rightHand.merged ? "(融合)" : ""}`;
        setStatus("🟢 右手检测中 · FPS: " + fpsCounter.fps);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        infoBar.textContent = `FPS:${fpsCounter.fps} | M1:${handCount1}手 M2:${handCount2}手 | 右手✗`;
        if (handCount1 > 0 || handCount2 > 0) {
          setStatus("⚠️ 检测到手但非右手");
        } else {
          setStatus("🔍 未检测到手");
        }
      }
    } catch (e) {
      console.error("检测错误:", e);
      setStatus("⚠️ 检测错误: " + e.message);
    }
  }

  requestAnimationFrame(detectLoop);
}

// ===================== 事件绑定 =====================
startBtn.addEventListener("click", startCamera);
switchBtn.addEventListener("click", switchCamera);
stopBtn.addEventListener("click", stopCamera);

// 检查 navigator.mediaDevices 是否存在
if (!navigator.mediaDevices) {
  setStatus("❌ 浏览器不支持 getUserMedia, 请使用 HTTPS 或 localhost");
  startBtn.disabled = true;
}

// 初始状态提示
setStatus("状态: 待启动 · 仅识别右手 · 点击启动按钮开始");

console.log("右手骨骼识别系统已加载. 等待用户启动.");
console.log("WebGPU 支持:", !!navigator.gpu);
</script>
</body>
</html>
