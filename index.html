<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄像头实时手部骨骼识别 · micro-handpose</title>
<style>
  /* ===== 全局样式 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0f1115;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  /* 舞台容器：水平垂直居中放置画面 */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* canvas 容器：保持摄像头宽高比，自适应窗口 */
  .canvas-wrap {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 16 / 9;          /* 默认 16:9，启动后按真实摄像头分辨率更新 */
    background: #000;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    border-radius: 10px;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 顶部状态栏 */
  .status-bar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 6px;
    font-size: 14px;
    color: #fff;
    pointer-events: none;
    z-index: 10;
  }
  .status-bar .left { display: flex; align-items: center; }
  .status-bar .right { font-variant-numeric: tabular-nums; opacity: 0.9; }
  .status-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff5252;
    margin-right: 8px;
    transition: background 0.2s ease;
    box-shadow: 0 0 6px rgba(255, 82, 82, 0.7);
  }
  .status-dot.active {
    background: #4caf50;
    box-shadow: 0 0 6px rgba(76, 175, 80, 0.7);
  }

  /* 右下角：切换摄像头按钮 */
  .cam-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 22px;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: background 0.2s ease, transform 0.1s ease;
    z-index: 20;
  }
  .cam-toggle:hover { background: rgba(255, 255, 255, 0.2); }
  .cam-toggle:active { transform: scale(0.96); }
  .cam-toggle:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .cam-toggle .cam-icon { font-size: 16px; line-height: 1; }
  .cam-toggle .cam-label { font-variant-numeric: tabular-nums; }

  /* 底部说明 */
  .info {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #888;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
    max-width: calc(100vw - 220px);   /* 避免与右下角按钮重叠 */
  }

  /* video 元素隐藏，仅用于喂给 micro-handpose */
  #video { display: none; }
</style>
</head>
<body>
  <!-- 隐藏的 video 元素，作为摄像头流的载体 -->
  <video id="video" playsinline muted></video>

  <div class="stage">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <!-- 顶部状态栏：显示检测状态与手数 -->
      <div class="status-bar">
        <div class="left">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">初始化中…</span>
        </div>
        <div class="right">检测到的手数: <span id="hand-count">0</span> / 2</div>
      </div>
    </div>
  </div>

  <!-- 右下角：前/后置摄像头切换按钮 -->
  <button class="cam-toggle" id="cam-toggle" type="button" title="切换前/后置摄像头">
    <span class="cam-icon">⇄</span>
    <span class="cam-label" id="cam-label">前置</span>
  </button>

  <div class="info">
    micro-handpose (WebGPU) · maxHands=2 · palmScoreThreshold=0.7 · scoreThreshold=0.5 · 需 Chrome 113+ / Edge 113+ / Safari 18+
  </div>

  <!-- ===== micro-handpose 通过 ESM 从 CDN 引入（无 npm / 构建工具） ===== -->
  <script type="module">
  /* =====================================================================
   * 摄像头实时手部骨骼识别与可视化
   * 模型：@svenflow/micro-handpose（纯 WebGPU 计算着色器实现）
   *   - 比旧版 MediaPipe Hands 更轻更快
   *   - 21 关键点输出顺序与 MediaPipe 一致
   *   - 支持前置 / 后置摄像头切换
   * ===================================================================== */

  // ESM 引入 micro-handpose（CDN）
  import { createHandpose } from 'https://cdn.jsdelivr.net/npm/@svenflow/micro-handpose@0.3.0/+esm';

  // ===== DOM 引用 =====
  const videoElement = document.getElementById('video');
  const canvasElement = document.getElementById('canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const canvasWrap = document.getElementById('canvas-wrap');
  const statusText = document.getElementById('status-text');
  const statusDot = document.getElementById('status-dot');
  const handCountEl = document.getElementById('hand-count');
  const camToggle = document.getElementById('cam-toggle');
  const camLabel = document.getElementById('cam-label');

  // ===== 配置常量 =====
  // 摄像头请求分辨率（实际分辨率会在 metadata 加载后校正）
  const CAM_WIDTH = 1280;
  const CAM_HEIGHT = 720;

  // 初始化 canvas 内部分辨率
  canvasElement.width = CAM_WIDTH;
  canvasElement.height = CAM_HEIGHT;

  // micro-handpose 配置参数（对应原 MediaPipe 参数）：
  //   maxHands              ≈ maxNumHands
  //   palmScoreThreshold    ≈ minDetectionConfidence（掌部检测阶段）
  //   scoreThreshold        ≈ minTrackingConfidence（关键点回归阶段）
  const HANDPOSE_OPTIONS = {
    maxHands: 2,
    palmScoreThreshold: 0.7,
    scoreThreshold: 0.5
  };

  // MediaPipe 标准 21 点手部骨架连接关系
  // （micro-handpose 不导出该常量，本地按 MediaPipe 顺序定义）
  const HAND_CONNECTIONS = [
    // 拇指
    [0, 1], [1, 2], [2, 3], [3, 4],
    // 食指
    [0, 5], [5, 6], [6, 7], [7, 8],
    // 中指
    [5, 9], [9, 10], [10, 11], [11, 12],
    // 无名指
    [9, 13], [13, 14], [14, 15], [15, 16],
    // 小指
    [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
  ];

  let handpose = null;
  let currentStream = null;
  let rafId = null;
  let currentFacingMode = 'user';   // 'user' = 前置, 'environment' = 后置
  let switching = false;            // 防止切换过程中重复点击

  /* ---------------------------------------------------------------------
   * 工具：根据当前摄像头方向判断是否镜像显示
   *   前置摄像头（selfie 视角）→ 镜像
   *   后置摄像头               → 不镜像
   * ------------------------------------------------------------------- */
  function shouldMirror() {
    return currentFacingMode === 'user';
  }

  /* ---------------------------------------------------------------------
   * 工具：将归一化 landmark 坐标转换为 canvas 像素坐标
   * landmark.x / landmark.y 均为 0~1 的归一化值
   * ------------------------------------------------------------------- */
  function lmToCanvas(lm) {
    const mirror = shouldMirror();
    const nx = mirror ? (1 - lm.x) : lm.x;
    return {
      x: nx * canvasElement.width,
      y: lm.y * canvasElement.height
    };
  }

  /* ---------------------------------------------------------------------
   * 1) 初始化 micro-handpose
   *    内部会请求 WebGPU adapter、下载权重、编译 WGSL 计算着色器
   * ------------------------------------------------------------------- */
  async function initHandpose() {
    // 浏览器 WebGPU 支持检测
    if (!('gpu' in navigator)) {
      throw new Error('当前浏览器不支持 WebGPU，请使用 Chrome 113+ / Edge 113+ / Safari 18+');
    }
    handpose = await createHandpose(HANDPOSE_OPTIONS);
  }

  /* ---------------------------------------------------------------------
   * 2) 启动摄像头（支持指定前置 / 后置）
   *    使用 navigator.mediaDevices.getUserMedia + facingMode 约束
   *    用 { ideal: facingMode } 而非强制约束，避免无对应摄像头时报错
   * ------------------------------------------------------------------- */
  async function startCamera(facingMode) {
    // 关闭旧流
    if (currentStream) {
      currentStream.getTracks().forEach((t) => t.stop());
      currentStream = null;
    }

    const constraints = {
      audio: false,
      video: {
        facingMode: { ideal: facingMode },
        width:  { ideal: CAM_WIDTH },
        height: { ideal: CAM_HEIGHT }
      }
    };

    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    currentStream = stream;
    videoElement.srcObject = stream;
    // 等待 video 真正就绪
    if (videoElement.readyState < 2) {
      await new Promise((resolve) => {
        videoElement.onloadeddata = resolve;
      });
    }
    await videoElement.play();
  }

  /* ---------------------------------------------------------------------
   * 切换前置 / 后置摄像头
   * ------------------------------------------------------------------- */
  async function switchCamera() {
    if (switching) return;
    switching = true;
    camToggle.disabled = true;
    try {
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      camLabel.textContent = currentFacingMode === 'user' ? '前置' : '后置';
      statusText.textContent = '切换摄像头中…';
      await startCamera(currentFacingMode);
      // 摄像头方向变化后，前一帧的 ROI 跟踪状态失效，重置之
      if (handpose) handpose.reset();
      statusText.textContent = '未检测到手';
    } catch (err) {
      console.error('[切换摄像头失败]', err);
      statusText.textContent = '切换失败：' + (err && err.message ? err.message : err);
      // 失败时回滚到原方向标签
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      camLabel.textContent = currentFacingMode === 'user' ? '前置' : '后置';
    } finally {
      switching = false;
      camToggle.disabled = false;
    }
  }

  /* ---------------------------------------------------------------------
   * 3) 逐帧处理 micro-handpose 返回的结果
   *    输入：HandposeResult[] —— 每个元素 { score, handedness, landmarks[21] }
   *    顺序：① 画摄像头画面 → ② 画手部骨骼 → ③ 更新状态栏
   * ------------------------------------------------------------------- */
  function onResults(hands) {
    drawCameraFrame();
    drawHandSkeleton(hands);
    updateStatusBar(hands);
  }

  /* ---------------------------------------------------------------------
   * 绘制摄像头画面（底层）
   * 前置摄像头镜像显示，后置不镜像
   * ------------------------------------------------------------------- */
  function drawCameraFrame() {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    if (videoElement.readyState >= 2) {
      if (shouldMirror()) {
        canvasCtx.translate(canvasElement.width, 0);
        canvasCtx.scale(-1, 1);
      }
      canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
    }
    canvasCtx.restore();
  }

  /* ---------------------------------------------------------------------
   * 绘制手部骨骼（关键点 + 连接线 + 索引编号 + 左右手标签）
   * 多只手时遍历结果数组逐只绘制
   * ------------------------------------------------------------------- */
  function drawHandSkeleton(hands) {
    if (!hands || hands.length === 0) return;
    canvasCtx.save();
    for (const hand of hands) {
      const landmarks = hand.landmarks;
      if (!landmarks || landmarks.length < 21) continue;
      drawConnections(landmarks);    // 1) 骨架连接线（绿色，2px）
      drawKeyPoints(landmarks);      // 2) 21 个关键点（红色圆点，3px）
      drawIndexLabels(landmarks);    // 3) 关键点编号 0–20
      drawHandednessLabel(landmarks, hand.handedness);  // 4) 左/右手标签（位于手腕处）
    }
    canvasCtx.restore();
  }

  /* ---------------------------------------------------------------------
   * 绘制骨架连接线（绿色，线宽 2px，使用 HAND_CONNECTIONS）
   * ------------------------------------------------------------------- */
  function drawConnections(landmarks) {
    canvasCtx.strokeStyle = '#00ff66';
    canvasCtx.lineWidth = 2;
    canvasCtx.lineCap = 'round';
    canvasCtx.beginPath();
    for (const [startIdx, endIdx] of HAND_CONNECTIONS) {
      const p1 = lmToCanvas(landmarks[startIdx]);
      const p2 = lmToCanvas(landmarks[endIdx]);
      if (!p1 || !p2) continue;
      canvasCtx.moveTo(p1.x, p1.y);
      canvasCtx.lineTo(p2.x, p2.y);
    }
    canvasCtx.stroke();
  }

  /* ---------------------------------------------------------------------
   * 绘制 21 个关键点（红色圆点，半径 3px）
   * ------------------------------------------------------------------- */
  function drawKeyPoints(landmarks) {
    canvasCtx.fillStyle = '#ff3b3b';
    for (const lm of landmarks) {
      const p = lmToCanvas(lm);
      canvasCtx.beginPath();
      canvasCtx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      canvasCtx.fill();
    }
  }

  /* ---------------------------------------------------------------------
   * 在每个关键点旁标出索引编号（0–20）
   * 文字向右下角偏移 6px，加黑色描边以保证在亮色背景下也可读
   * ------------------------------------------------------------------- */
  function drawIndexLabels(landmarks) {
    canvasCtx.font = '13px -apple-system, "Segoe UI", sans-serif';
    canvasCtx.textAlign = 'left';
    canvasCtx.textBaseline = 'top';
    canvasCtx.lineWidth = 3;
    canvasCtx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
    canvasCtx.fillStyle = '#ffd400';
    for (let i = 0; i < landmarks.length; i++) {
      const p = lmToCanvas(landmarks[i]);
      const text = String(i);
      canvasCtx.strokeText(text, p.x + 6, p.y + 6);
      canvasCtx.fillText(text, p.x + 6, p.y + 6);
    }
  }

  /* ---------------------------------------------------------------------
   * 在手腕（索引 0）附近显示左/右手标签
   * micro-handpose 假设输入为自拍镜像视角判定 handedness；
   * 当使用后置摄像头时，需把 handedness 互换
   * ------------------------------------------------------------------- */
  function drawHandednessLabel(landmarks, handedness) {
    if (!handedness) return;
    // 后置摄像头方向取反
    let label = (handedness === 'left') ? '左' : '右';
    if (!shouldMirror()) {
      label = (label === '左') ? '右' : '左';
    }
    const p = lmToCanvas(landmarks[0]);
    canvasCtx.font = 'bold 16px -apple-system, "Segoe UI", sans-serif';
    canvasCtx.textAlign = 'left';
    canvasCtx.textBaseline = 'middle';
    canvasCtx.lineWidth = 3;
    canvasCtx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
    canvasCtx.fillStyle = '#4fc3ff';
    canvasCtx.strokeText(label, p.x - 24, p.y - 14);
    canvasCtx.fillText(label, p.x - 24, p.y - 14);
  }

  /* ---------------------------------------------------------------------
   * 更新顶部状态栏：是否检测到手 + 数量
   * ------------------------------------------------------------------- */
  function updateStatusBar(hands) {
    const count = (hands && hands.length) || 0;
    if (count > 0) {
      statusDot.classList.add('active');
      statusText.textContent = '已检测到手';
    } else {
      statusDot.classList.remove('active');
      statusText.textContent = '未检测到手';
    }
    handCountEl.textContent = count;
  }

  /* ---------------------------------------------------------------------
   * 主循环：requestAnimationFrame 驱动，每帧调用 handpose.detect
   * ------------------------------------------------------------------- */
  async function loop() {
    try {
      if (handpose && videoElement.readyState >= 2) {
        // micro-handpose 的 detect 接受 HTMLVideoElement
        const hands = await handpose.detect(videoElement);
        onResults(hands || []);
      }
    } catch (err) {
      console.error('[detect 出错]', err);
    }
    rafId = requestAnimationFrame(loop);
  }

  /* ---------------------------------------------------------------------
   * 根据真实摄像头分辨率校正 canvas 内部分辨率与容器宽高比
   * ------------------------------------------------------------------- */
  videoElement.addEventListener('loadedmetadata', () => {
    const w = videoElement.videoWidth || CAM_WIDTH;
    const h = videoElement.videoHeight || CAM_HEIGHT;
    canvasElement.width = w;
    canvasElement.height = h;
    canvasWrap.style.aspectRatio = `${w} / ${h}`;
  });

  /* ---------------------------------------------------------------------
   * 绑定切换按钮
   * ------------------------------------------------------------------- */
  camToggle.addEventListener('click', switchCamera);

  /* ---------------------------------------------------------------------
   * 启动入口
   * 注意：getUserMedia / WebGPU 均要求安全上下文（HTTPS 或 localhost）。
   * 若用 file:// 打开无法授权摄像头，请改用本地服务器：
   *   cd /home/z/my-project/download && python3 -m http.server 8000
   * 然后浏览器访问 http://localhost:8000/index.html
   * ------------------------------------------------------------------- */
  async function main() {
    try {
      statusText.textContent = '加载模型中…';
      await initHandpose();

      statusText.textContent = '请求摄像头权限…';
      await startCamera(currentFacingMode);

      statusText.textContent = '未检测到手';
      loop();
    } catch (err) {
      console.error('[启动失败]', err);
      statusText.textContent = '启动失败：' + (err && err.message ? err.message : err);
    }
  }

  main();
  </script>
</body>
</html>
