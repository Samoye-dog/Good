<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>右手骨骼识别 · WebGPU · 抗抖动</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(ellipse at top, #1a1a2e 0%, #0a0a15 100%);
    color: #e0e0e0;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 920px; margin: 0 auto; padding: 16px; }
  header { text-align: center; margin-bottom: 16px; }
  header h1 {
    font-size: 22px;
    background: linear-gradient(90deg, #00FF88, #00D4FF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  header p { font-size: 12px; color: #6a6a8a; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-bottom: 12px;
  }
  .controls button, .controls select {
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: inherit;
  }
  .controls button:hover:not(:disabled), .controls select:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(0,255,136,0.4);
  }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  .controls button.primary {
    background: linear-gradient(90deg, #00FF88, #00D4FF);
    color: #000; border: none; font-weight: 600;
  }
  .controls button.primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0,255,136,0.3);
  }
  .controls button.active {
    background: rgba(255, 215, 61, 0.15);
    border-color: rgba(255, 215, 61, 0.6);
    color: #FFD93D;
  }
  .status-bar {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-bottom: 12px;
    font-size: 12px;
  }
  .status-bar .chip {
    background: rgba(255,255,255,0.04);
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.08);
    display: inline-flex;
    align-items: center;
  }
  .status-bar .label { color: #6a6a8a; margin-right: 4px; }
  .status-bar .value { color: #00FF88; font-weight: 600; }
  .status-bar .value.warn { color: #FFD93D; }
  .status-bar .value.err { color: #FF6B6B; }
  .status-bar .value.hold { color: #00D4FF; }
  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
  }
  .video-wrap.mirrored { transform: scaleX(-1); }
  video, canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  canvas { pointer-events: none; }
  .info-row {
    margin-top: 14px;
    display: flex; flex-wrap: wrap; gap: 16px;
    justify-content: center;
    font-size: 12px; color: #6a6a8a;
  }
  .legend {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; margin-top: 12px;
    font-size: 11px;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
  .loading-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #00FF88;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { margin-top: 12px; font-size: 13px; color: #aaa; }
  .no-hand-hint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.55);
    font-size: 15px;
    text-align: center;
    pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    line-height: 1.6;
    z-index: 5;
  }
  .video-wrap.mirrored .no-hand-hint { transform: translate(-50%, -50%) scaleX(-1); }
  .badge-overlay {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    z-index: 4;
    pointer-events: none;
    border: 1px solid rgba(0,255,136,0.3);
  }
  .badge-overlay.hold { border-color: rgba(0, 212, 255, 0.5); }
  .badge-overlay .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #00FF88;
    margin-right: 6px;
    vertical-align: middle;
    box-shadow: 0 0 6px #00FF88;
  }
  .badge-overlay.hold .dot { background: #00D4FF; box-shadow: 0 0 6px #00D4FF; }
  .video-wrap.mirrored .badge-overlay {
    transform: translateX(calc(100% + 24px)) scaleX(-1);
    transform-origin: left center;
    left: 12px;
    right: auto;
  }
  .quality-bar {
    position: absolute;
    bottom: 12px; left: 12px; right: 12px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
    z-index: 4;
    pointer-events: none;
  }
  .quality-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #FF6B6B, #FFD93D, #00FF88);
    width: 0%;
    transition: width 0.1s linear;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>右手骨骼识别系统</h1>
    <p>MediaPipe + TF.js 双模型融合 · 1€ 滤波 · 失败保持 · 极端角度抗抖</p>
  </header>

  <div class="controls">
    <button id="startBtn" class="primary">启动</button>
    <button id="switchBtn" disabled>切换摄像头</button>
    <select id="modelSelect">
      <option value="fusion">融合模式 (MediaPipe + TF.js 兜底)</option>
      <option value="mediapipe">仅 MediaPipe (WebGL · 高精度)</option>
      <option value="tfjs">仅 TF.js (WebGPU · 低延迟)</option>
    </select>
    <button id="swapBtn" title="若识别的不是右手, 点击互换过滤标签">↔ 左右手互换</button>
  </div>

  <div class="status-bar">
    <span class="chip"><span class="label">状态</span><span class="value" id="status">未启动</span></span>
    <span class="chip"><span class="label">摄像头</span><span class="value" id="cameraInfo">-</span></span>
    <span class="chip"><span class="label">后端</span><span class="value" id="backendInfo">-</span></span>
    <span class="chip"><span class="label">WebGPU</span><span class="value" id="webgpuInfo">检测中</span></span>
    <span class="chip"><span class="label">FPS</span><span class="value" id="fps">0</span></span>
    <span class="chip"><span class="label">手</span><span class="value" id="handInfo">未检测</span></span>
    <span class="chip"><span class="label">平滑</span><span class="value" id="smoothInfo">-</span></span>
  </div>

  <div class="video-wrap" id="videoWrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="badge-overlay" id="badgeOverlay" style="display:none">
      <span class="dot"></span><span id="badgeText">右手</span>
    </div>
    <div class="quality-bar"><div class="quality-bar-fill" id="qualityBarFill"></div></div>
    <div class="no-hand-hint" id="noHandHint" style="display:none">未检测到右手<br>请将右手对准摄像头</div>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">加载中...</div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#FF6B6B"></span>手腕 (0)</div>
    <div class="legend-item"><span class="legend-dot" style="background:#FFD93D"></span>指关节</div>
    <div class="legend-item"><span class="legend-dot" style="background:#00D4FF"></span>指尖</div>
    <div class="legend-item"><span class="legend-dot" style="background:#00FF88"></span>骨骼连线</div>
    <div class="legend-item"><span class="legend-dot" style="background:#00D4FF;opacity:.6"></span>保持中 (蓝)</div>
  </div>

  <div class="info-row">
    <span>· 仅识别右手</span>
    <span>· 1€ 滤波器抗抖动</span>
    <span>· 检测丢失保持 300ms</span>
    <span>· 双模型互相兜底</span>
  </div>
</div>

<!-- TensorFlow.js (UMD 全局变量: window.tf, window.handPoseDetection) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.22.0/dist/tf-backend-webgpu.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"></script>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0";

// ===== 常量 =====
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];
const FINGERTIPS = new Set([4, 8, 12, 16, 20]);
const NUM_LANDMARKS = 21;

const MP_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const MP_WASM_PATH = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/wasm";

// ===== DOM =====
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const videoWrap = document.getElementById('videoWrap');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const modelSelect = document.getElementById('modelSelect');
const swapBtn = document.getElementById('swapBtn');
const statusEl = document.getElementById('status');
const cameraInfo = document.getElementById('cameraInfo');
const backendInfo = document.getElementById('backendInfo');
const webgpuInfo = document.getElementById('webgpuInfo');
const fpsEl = document.getElementById('fps');
const handInfo = document.getElementById('handInfo');
const smoothInfo = document.getElementById('smoothInfo');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');
const noHandHint = document.getElementById('noHandHint');
const badgeOverlay = document.getElementById('badgeOverlay');
const badgeText = document.getElementById('badgeText');
const qualityBarFill = document.getElementById('qualityBarFill');

// ===== 状态 =====
let mpHandLandmarker = null;
let tfDetector = null;
let tfBackendName = null;
let stream = null;
let currentFacing = 'user';
let currentModel = 'fusion';   // 默认融合模式
let swapHand = false;
let isRunning = false;
let isProcessing = false;
let lastVideoTime = -1;
let frameCount = 0;
let lastFpsTime = performance.now();
let webgpuSupported = false;
let mpReady = false;
let tfReady = false;

// ===== 1€ 滤波器 (每个关键点一个独立滤波器) =====
// 论文: Casiez et al., 2012. 平滑高频抖动同时保留大动作.
class OneEuroFilter {
  constructor(freq = 60, minCutoff = 1.0, beta = 0.05, dCutoff = 1.0) {
    this.freq = freq;
    this.minCutoff = minCutoff;
    this.beta = beta;
    this.dCutoff = dCutoff;
    this.xPrev = null;
    this.dxPrev = 0;
    this.tPrev = null;
  }
  static alpha(cutoff, freq, te) {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / te);
  }
  filter(x, t) {
    if (this.tPrev === null) {
      this.tPrev = t;
      this.xPrev = x;
      this.dxPrev = 0;
      return x;
    }
    const te = Math.max((t - this.tPrev) / 1000, 1 / this.freq);
    this.tPrev = t;

    // 估计导数
    const dx = (x - this.xPrev) / te;
    const adx = OneEuroFilter.alpha(this.dCutoff, this.freq, te);
    const dxHat = adx * dx + (1 - adx) * this.dxPrev;

    // 自适应截止频率: 大动作 -> 高 cutoff (跟随), 小动作 -> 低 cutoff (稳定)
    const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
    const a = OneEuroFilter.alpha(cutoff, this.freq, te);
    const xHat = a * x + (1 - a) * this.xPrev;

    this.xPrev = xHat;
    this.dxPrev = dxHat;
    return xHat;
  }
  reset() {
    this.xPrev = null;
    this.dxPrev = 0;
    this.tPrev = null;
  }
}

// 为 21 个 landmark × (x, y, z) 维护一组滤波器
let landmarkFilters = [];
function initFilters() {
  landmarkFilters = [];
  for (let i = 0; i < NUM_LANDMARKS; i++) {
    landmarkFilters.push({
      x: new OneEuroFilter(60, 1.2, 0.02),
      y: new OneEuroFilter(60, 1.2, 0.02),
      z: new OneEuroFilter(60, 0.8, 0.01)  // z 抖动更厉害, 滤得更狠
    });
  }
}
initFilters();

// ===== 失败保持 (失败时沿用上一帧 300ms) =====
let lastValidLandmarks = null;     // 最后一次成功检测到的 (归一化) landmark
let lastValidTime = 0;             // 最后一次成功的时间戳
let lastValidConfidence = 0;
let lastValidModel = '';
const HOLD_DURATION = 300;         // ms, 检测丢失后保持的时间
const HOLD_FADE_START = 200;       // ms, 之后开始淡出

// ===== WebGPU 检测 =====
async function detectWebGPU() {
  if (!navigator.gpu) return false;
  try {
    const adapter = await navigator.gpu.requestAdapter();
    return !!adapter;
  } catch (e) { return false; }
}

// ===== MediaPipe HandLandmarker 初始化 =====
async function initMediaPipe() {
  if (mpReady) return;
  loadingOverlay.classList.add('show');
  loadingText.textContent = '加载 MediaPipe 模型 (WebGL)...';

  const vision = await FilesetResolver.forVisionTasks(MP_WASM_PATH);
  mpHandLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: MP_MODEL_URL,
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    // 提高阈值 + 滞回机制, 但允许检测时也用低阈值先尝试
    minHandDetectionConfidence: 0.4,
    minHandPresenceConfidence: 0.5,
    minTrackingConfidence: 0.5
  });
  mpReady = true;
  loadingOverlay.classList.remove('show');
}

// ===== TF.js HandPoseDetector 初始化 =====
async function initTFJS() {
  if (tfReady) return;
  loadingOverlay.classList.add('show');
  loadingText.textContent = '加载 TF.js 模型 (' + (webgpuSupported ? 'WebGPU' : 'WebGL') + ')...';

  if (webgpuSupported) {
    try {
      await tf.setBackend('webgpu');
      await tf.ready();
      tfBackendName = 'webgpu';
    } catch (e) {
      console.warn('WebGPU 初始化失败, 回退到 WebGL', e);
      await tf.setBackend('webgl');
      await tf.ready();
      tfBackendName = 'webgl';
    }
  } else {
    await tf.setBackend('webgl');
    await tf.ready();
    tfBackendName = 'webgl';
  }

  const model = handPoseDetection.SupportedModels.MediaPipeHands;
  tfDetector = await handPoseDetection.createDetector(model, {
    runtime: 'tfjs',
    maxHands: 2,
    modelType: 'full'
  });
  tfReady = true;
  loadingOverlay.classList.remove('show');
}

// ===== 摄像头启动 =====
async function startCamera(facing) {
  loadingOverlay.classList.add('show');
  loadingText.textContent = facing === 'user' ? '启动前置摄像头...' : '启动后置摄像头...';

  if (stream) stream.getTracks().forEach(t => t.stop());

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;

    currentFacing = facing;
    cameraInfo.textContent = facing === 'user' ? '前置' : '后置';
    cameraInfo.className = 'value';

    if (facing === 'user') {
      videoWrap.classList.add('mirrored');
    } else {
      videoWrap.classList.remove('mirrored');
    }

    loadingOverlay.classList.remove('show');
    return true;
  } catch (e) {
    loadingOverlay.classList.remove('show');
    statusEl.textContent = '启动失败';
    statusEl.className = 'value err';
    alert('无法访问摄像头: ' + e.message);
    return false;
  }
}

// ===== 单模型检测函数 (返回 normalized landmarks 或 null) =====
function detectMediaPipe() {
  if (!mpReady) return null;
  const result = mpHandLandmarker.detectForVideo(video, performance.now());
  if (!result.landmarks || result.landmarks.length === 0) return null;
  const expected = swapHand ? 'Left' : 'Right';
  for (let i = 0; i < result.landmarks.length; i++) {
    const handed = result.handedness[i][0];
    if (handed.categoryName === expected) {
      return { landmarks: result.landmarks[i], confidence: handed.score, model: 'MediaPipe' };
    }
  }
  return null;
}

async function detectTFJS() {
  if (!tfReady) return null;
  const hands = await tfDetector.estimateHands(video, { flipHorizontal: false });
  if (!hands || hands.length === 0) return null;
  const expected = swapHand ? 'Left' : 'Right';
  for (const hand of hands) {
    const label = hand.handedness || 'Right';
    if (label === expected || (label && label.toLowerCase() === expected.toLowerCase())) {
      const landmarks = hand.keypoints.map(p => ({
        x: p.x / canvas.width,
        y: p.y / canvas.height,
        z: p.z || 0
      }));
      return { landmarks, confidence: hand.score || 0.85, model: 'TF.js' };
    }
  }
  return null;
}

// ===== 检测循环 =====
function detectLoop() {
  if (!isRunning) return;

  if (video.readyState >= 2 && video.currentTime !== lastVideoTime && !isProcessing) {
    lastVideoTime = video.currentTime;
    isProcessing = true;
    detectFrame().finally(() => { isProcessing = false; });
  }

  requestAnimationFrame(detectLoop);
}

async function detectFrame() {
  try {
    const now = performance.now();
    let detection = null;
    let usedBackend = '-';

    if (currentModel === 'mediapipe') {
      if (mpReady) {
        detection = detectMediaPipe();
        usedBackend = 'WebGL';
      }
    } else if (currentModel === 'tfjs') {
      if (tfReady) {
        detection = await detectTFJS();
        usedBackend = tfBackendName === 'webgpu' ? 'WebGPU' : 'WebGL';
      }
    } else {
      // 融合模式: 先用 MediaPipe (快, 同步), 失败再用 TF.js 兜底
      if (mpReady) {
        detection = detectMediaPipe();
        usedBackend = 'MP·WebGL';
      }
      if (!detection && tfReady) {
        detection = await detectTFJS();
        if (detection) {
          usedBackend = tfBackendName === 'webgpu' ? 'TF·WebGPU' : 'TF·WebGL';
        } else if (mpReady) {
          usedBackend = 'MP·WebGL';
        }
      }
      if (!mpReady && !tfReady) usedBackend = '-';
    }

    // 失败保持逻辑
    let displayLandmarks = null;
    let displayConfidence = 0;
    let displayModel = '';
    let isHolding = false;

    if (detection) {
      // 成功检测: 应用 1€ 滤波平滑后输出
      const smoothed = smoothLandmarks(detection.landmarks, now);
      lastValidLandmarks = smoothed;
      lastValidTime = now;
      lastValidConfidence = detection.confidence;
      lastValidModel = detection.model;
      displayLandmarks = smoothed;
      displayConfidence = detection.confidence;
      displayModel = detection.model;
    } else if (lastValidLandmarks && (now - lastValidTime) < HOLD_DURATION) {
      // 短暂丢失: 保持上一帧, 但标记为"保持中"
      displayLandmarks = lastValidLandmarks;
      displayConfidence = lastValidConfidence * 0.7;  // 置信度衰减
      displayModel = lastValidModel + '·保持';
      isHolding = true;
    } else {
      // 长时间丢失: 重置滤波器
      if (lastValidLandmarks && (now - lastValidTime) >= HOLD_DURATION) {
        initFilters();
        lastValidLandmarks = null;
      }
    }

    // 更新后端显示
    if (isRunning) {
      backendInfo.textContent = usedBackend;
      backendInfo.className = 'value' + (usedBackend.includes('WebGPU') ? '' : (usedBackend.includes('WebGL') ? '' : ' warn'));
    }

    drawOverlay(displayLandmarks, displayConfidence, displayModel, isHolding, now);

    // FPS
    frameCount++;
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = Math.round(frameCount * 1000 / (now - lastFpsTime));
      frameCount = 0;
      lastFpsTime = now;
    }
  } catch (e) {
    console.error('Detection error:', e);
  }
}

// ===== 应用 1€ 滤波 =====
function smoothLandmarks(landmarks, now) {
  const out = new Array(landmarks.length);
  for (let i = 0; i < landmarks.length; i++) {
    const p = landmarks[i];
    const f = landmarkFilters[i];
    out[i] = {
      x: f.x.filter(p.x, now),
      y: f.y.filter(p.y, now),
      z: f.z.filter(p.z, now)
    };
  }
  return out;
}

// ===== 绘制骨骼 =====
function drawOverlay(landmarks, confidence, modelLabel, isHolding, now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!landmarks) {
    noHandHint.style.display = 'block';
    badgeOverlay.style.display = 'none';
    handInfo.textContent = '未检测';
    handInfo.className = 'value err';
    qualityBarFill.style.width = '0%';
    smoothInfo.textContent = '-';
    smoothInfo.className = 'value';
    return;
  }

  noHandHint.style.display = 'none';
  badgeOverlay.style.display = 'block';
  badgeOverlay.classList.toggle('hold', isHolding);
  const pct = Math.max(0, Math.min(100, confidence * 100)).toFixed(0);
  badgeText.textContent = `右手 · ${modelLabel} · ${pct}%${isHolding ? ' (保持)' : ''}`;
  handInfo.textContent = `右手 ${pct}%${isHolding ? '·保持' : ''}`;
  handInfo.className = 'value' + (isHolding ? ' hold' : '');
  qualityBarFill.style.width = pct + '%';
  smoothInfo.textContent = '1€ ON';
  smoothInfo.className = 'value';

  const W = canvas.width;
  const H = canvas.height;

  // 持续保持时淡出
  let alpha = 1.0;
  if (isHolding) {
    const holdTime = now - lastValidTime;
    if (holdTime > HOLD_FADE_START) {
      alpha = Math.max(0.4, 1 - (holdTime - HOLD_FADE_START) / (HOLD_DURATION - HOLD_FADE_START) * 0.6);
    }
  }
  ctx.globalAlpha = alpha;

  // 骨骼连线
  ctx.strokeStyle = isHolding ? 'rgba(0, 212, 255, 0.85)' : 'rgba(0, 255, 136, 0.9)';
  ctx.lineWidth = Math.max(3, W * 0.005);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = isHolding ? '#00D4FF' : '#00FF88';
  ctx.shadowBlur = 12;

  for (const [a, b] of HAND_CONNECTIONS) {
    const p1 = landmarks[a];
    const p2 = landmarks[b];
    ctx.beginPath();
    ctx.moveTo(p1.x * W, p1.y * H);
    ctx.lineTo(p2.x * W, p2.y * H);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // 关键点
  for (let i = 0; i < landmarks.length; i++) {
    const p = landmarks[i];
    const x = p.x * W;
    const y = p.y * H;
    const r = Math.max(4, W * 0.007);

    if (i === 0) {
      ctx.fillStyle = '#FF6B6B';
      ctx.shadowColor = '#FF6B6B';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(x, y, r * 1.4, 0, Math.PI * 2);
      ctx.fill();
    } else if (FINGERTIPS.has(i)) {
      ctx.fillStyle = isHolding ? '#7FE5FF' : '#00D4FF';
      ctx.shadowColor = '#00D4FF';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = isHolding ? 'rgba(255, 217, 61, 0.7)' : '#FFD93D';
      ctx.shadowColor = 'rgba(255, 217, 61, 0.6)';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.85, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1.0;
}

// ===== 事件绑定 =====
startBtn.addEventListener('click', async () => {
  if (isRunning) {
    isRunning = false;
    startBtn.textContent = '启动';
    startBtn.classList.add('primary');
    statusEl.textContent = '已停止';
    statusEl.className = 'value warn';
    if (stream) stream.getTracks().forEach(t => t.stop());
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    fpsEl.textContent = '0';
    handInfo.textContent = '未检测';
    handInfo.className = 'value warn';
    smoothInfo.textContent = '-';
    noHandHint.style.display = 'none';
    badgeOverlay.style.display = 'none';
    qualityBarFill.style.width = '0%';
    lastValidLandmarks = null;
    initFilters();
    return;
  }

  startBtn.disabled = true;
  statusEl.textContent = '初始化...';
  statusEl.className = 'value warn';

  if (!webgpuSupported) webgpuSupported = await detectWebGPU();
  webgpuInfo.textContent = webgpuSupported ? '支持' : '不支持';
  webgpuInfo.className = 'value' + (webgpuSupported ? '' : ' warn');

  // 融合模式: 两个模型都加载
  if (currentModel === 'fusion') {
    await initMediaPipe();
    await initTFJS();
    backendInfo.textContent = 'MP+TF';
    backendInfo.className = 'value';
  } else if (currentModel === 'mediapipe') {
    await initMediaPipe();
    backendInfo.textContent = 'WebGL';
    backendInfo.className = 'value';
  } else {
    await initTFJS();
    backendInfo.textContent = tfBackendName === 'webgpu' ? 'WebGPU' : 'WebGL';
    backendInfo.className = 'value' + (tfBackendName === 'webgpu' ? '' : ' warn');
  }

  const ok = await startCamera(currentFacing);
  startBtn.disabled = false;

  if (ok) {
    isRunning = true;
    startBtn.textContent = '停止';
    startBtn.classList.remove('primary');
    statusEl.textContent = '运行中';
    statusEl.className = 'value';
    switchBtn.disabled = false;
    detectLoop();
  } else {
    statusEl.textContent = '启动失败';
    statusEl.className = 'value err';
  }
});

switchBtn.addEventListener('click', async () => {
  if (!isRunning) return;
  const next = currentFacing === 'user' ? 'environment' : 'user';
  await startCamera(next);
  // 切摄像头后重置滤波器
  initFilters();
  lastValidLandmarks = null;
});

modelSelect.addEventListener('change', async (e) => {
  const newModel = e.target.value;
  if (newModel === currentModel) return;

  const wasRunning = isRunning;
  isRunning = false;
  currentModel = newModel;

  if (wasRunning) {
    statusEl.textContent = '切换模型...';
    statusEl.className = 'value warn';
    if (newModel === 'fusion') {
      await initMediaPipe();
      await initTFJS();
      backendInfo.textContent = 'MP+TF';
      backendInfo.className = 'value';
    } else if (newModel === 'mediapipe') {
      await initMediaPipe();
      backendInfo.textContent = 'WebGL';
      backendInfo.className = 'value';
    } else {
      await initTFJS();
      backendInfo.textContent = tfBackendName === 'webgpu' ? 'WebGPU' : 'WebGL';
      backendInfo.className = 'value' + (tfBackendName === 'webgpu' ? '' : ' warn');
    }
    initFilters();
    lastValidLandmarks = null;
    isRunning = true;
    statusEl.textContent = '运行中';
    statusEl.className = 'value';
    detectLoop();
  }
});

swapBtn.addEventListener('click', () => {
  swapHand = !swapHand;
  swapBtn.classList.toggle('active', swapHand);
  swapBtn.title = swapHand
    ? '当前过滤: Left 标签 (点击恢复 Right)'
    : '当前过滤: Right 标签 (点击互换为 Left)';
  initFilters();
  lastValidLandmarks = null;
});

// 初始 WebGPU 检测
(async () => {
  webgpuSupported = await detectWebGPU();
  webgpuInfo.textContent = webgpuSupported ? '支持' : '不支持';
  webgpuInfo.className = 'value' + (webgpuSupported ? '' : ' warn');
})();
</script>
