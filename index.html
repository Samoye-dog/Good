<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄像头实时手部骨骼识别 · MediaPipe Hands</title>
<style>
  /* ===== 全局样式 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0f1115;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  /* 舞台容器：水平垂直居中放置画面 */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* canvas 容器：保持摄像头宽高比，自适应窗口 */
  .canvas-wrap {
    position: relative;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 16 / 9;          /* 默认 16:9，启动后会按真实摄像头分辨率更新 */
    background: #000;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    border-radius: 10px;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 顶部状态栏 */
  .status-bar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 6px;
    font-size: 14px;
    color: #fff;
    pointer-events: none;
    z-index: 10;
  }
  .status-bar .left { display: flex; align-items: center; }
  .status-bar .right { font-variant-numeric: tabular-nums; opacity: 0.9; }
  .status-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff5252;
    margin-right: 8px;
    transition: background 0.2s ease;
    box-shadow: 0 0 6px rgba(255, 82, 82, 0.7);
  }
  .status-dot.active {
    background: #4caf50;
    box-shadow: 0 0 6px rgba(76, 175, 80, 0.7);
  }

  /* 底部说明 */
  .info {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #888;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
  }

  /* video 元素隐藏，仅用于喂给 MediaPipe */
  #video { display: none; }
</style>
</head>
<body>
  <!-- 隐藏的 video 元素，作为摄像头流的载体 -->
  <video id="video" playsinline></video>

  <div class="stage">
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <!-- 顶部状态栏：显示检测状态与手数 -->
      <div class="status-bar">
        <div class="left">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">初始化中…</span>
        </div>
        <div class="right">检测到的手数: <span id="hand-count">0</span> / 2</div>
      </div>
    </div>
  </div>

  <div class="info">
    MediaPipe Hands · maxNumHands=2 · modelComplexity=1 · minDetectionConfidence=0.7 · minTrackingConfidence=0.5
  </div>

  <!-- ===== MediaPipe CDN 引入（无 npm / 构建工具） ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
  /* =====================================================================
   * 摄像头实时手部骨骼识别与可视化
   * 基于 MediaPipe Hands JavaScript 方案（CDN 引入）
   *
   * 代码组织：
   *   1) initHands()      —— 初始化 MediaPipe Hands
   *   2) initCamera()     —— 初始化摄像头
   *   3) onResults()      —— 逐帧处理 MediaPipe 返回的结果
   *   4) drawCameraFrame —— 绘制摄像头画面（底层）
   *   5) drawHandSkeleton—— 绘制手部骨骼（关键点 + 连接线 + 编号）
   *   6) updateStatusBar —— 更新顶部状态栏
   * 替换自定义逻辑时，主要修改 drawHandSkeleton 内的三个子函数即可。
   * ===================================================================== */

  // ===== DOM 引用 =====
  const videoElement = document.getElementById('video');
  const canvasElement = document.getElementById('canvas');
  const canvasCtx = canvasElement.getContext('2d');
  const canvasWrap = document.getElementById('canvas-wrap');
  const statusText = document.getElementById('status-text');
  const statusDot = document.getElementById('status-dot');
  const handCountEl = document.getElementById('hand-count');

  // ===== 配置常量 =====
  // 是否启用镜像（自拍视角），开启后手在画面中的位置更符合直觉
  const MIRROR = true;
  // 摄像头请求分辨率（实际分辨率会在 metadata 加载后校正）
  const CAM_WIDTH = 1280;
  const CAM_HEIGHT = 720;

  // 初始化 canvas 内部分辨率
  canvasElement.width = CAM_WIDTH;
  canvasElement.height = CAM_HEIGHT;

  let hands = null;
  let camera = null;

  /* ---------------------------------------------------------------------
   * 工具函数：将归一化的 landmark 坐标转换为 canvas 像素坐标
   * landmark.x / landmark.y 均为 0~1 的归一化值
   * ------------------------------------------------------------------- */
  function lmToCanvas(lm) {
    const nx = MIRROR ? (1 - lm.x) : lm.x;
    return {
      x: nx * canvasElement.width,
      y: lm.y * canvasElement.height
    };
  }

  /* ---------------------------------------------------------------------
   * 1) 初始化 MediaPipe Hands
   *    设置参数并注册逐帧回调
   * ------------------------------------------------------------------- */
  function initHands() {
    // locateFile 指向 CDN 上的 wasm / model 文件
    hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    // 配置参数（对应需求第 5 条）
    hands.setOptions({
      maxNumHands: 2,              // 最多检测 2 只手
      modelComplexity: 1,          // 模型复杂度：0=Lite / 1=Full
      minDetectionConfidence: 0.7, // 检测置信度阈值
      minTrackingConfidence: 0.5   // 跟踪置信度阈值
    });

    // 注册逐帧结果回调
    hands.onResults(onResults);
  }

  /* ---------------------------------------------------------------------
   * 2) 初始化摄像头
   *    使用 MediaPipe Camera 工具，每帧将 video 喂给 Hands
   * ------------------------------------------------------------------- */
  function initCamera() {
    camera = new Camera(videoElement, {
      onFrame: async () => {
        // 将当前 video 帧送入 MediaPipe 推理
        await hands.send({ image: videoElement });
      },
      width: CAM_WIDTH,
      height: CAM_HEIGHT
    });
    return camera.start();
  }

  /* ---------------------------------------------------------------------
   * 3) 逐帧处理 MediaPipe 返回的结果
   *    顺序：① 画摄像头画面 → ② 画手部骨骼 → ③ 更新状态栏
   * ------------------------------------------------------------------- */
  function onResults(results) {
    drawCameraFrame(results);
    drawHandSkeleton(results);
    updateStatusBar(results);
  }

  /* ---------------------------------------------------------------------
   * 绘制摄像头画面（底层）
   * 通过画布变换实现镜像，使画面与自拍视角一致
   * ------------------------------------------------------------------- */
  function drawCameraFrame(results) {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    if (results.image) {
      if (MIRROR) {
        canvasCtx.translate(canvasElement.width, 0);
        canvasCtx.scale(-1, 1);
      }
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
    }
    canvasCtx.restore();
  }

  /* ---------------------------------------------------------------------
   * 绘制手部骨骼（关键点 + 连接线 + 索引编号）
   * 多只手时遍历 multiHandLandmarks 逐只绘制
   * ------------------------------------------------------------------- */
  function drawHandSkeleton(results) {
    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) return;
    canvasCtx.save();
    for (const landmarks of results.multiHandLandmarks) {
      drawConnections(landmarks);    // 1) 骨架连接线（绿色，2px）
      drawKeyPoints(landmarks);      // 2) 21 个关键点（红色圆点，3px）
      drawIndexLabels(landmarks);    // 3) 关键点编号 0–20
    }
    canvasCtx.restore();
  }

  /* ---------------------------------------------------------------------
   * 绘制骨架连接线（绿色，线宽 2px，使用 HAND_CONNECTIONS）
   * HAND_CONNECTIONS 是一个 [[startIdx, endIdx], ...] 的二维数组，
   * 由 @mediapipe/hands 脚本在加载后挂载到全局。
   * ------------------------------------------------------------------- */
  function drawConnections(landmarks) {
    if (typeof HAND_CONNECTIONS === 'undefined') return;
    canvasCtx.strokeStyle = '#00ff66';
    canvasCtx.lineWidth = 2;
    canvasCtx.lineCap = 'round';
    canvasCtx.beginPath();
    for (const [startIdx, endIdx] of HAND_CONNECTIONS) {
      const p1 = lmToCanvas(landmarks[startIdx]);
      const p2 = lmToCanvas(landmarks[endIdx]);
      if (!p1 || !p2) continue;
      canvasCtx.moveTo(p1.x, p1.y);
      canvasCtx.lineTo(p2.x, p2.y);
    }
    canvasCtx.stroke();
  }

  /* ---------------------------------------------------------------------
   * 绘制 21 个关键点（红色圆点，半径 3px）
   * ------------------------------------------------------------------- */
  function drawKeyPoints(landmarks) {
    canvasCtx.fillStyle = '#ff3b3b';
    for (const lm of landmarks) {
      const p = lmToCanvas(lm);
      canvasCtx.beginPath();
      canvasCtx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      canvasCtx.fill();
    }
  }

  /* ---------------------------------------------------------------------
   * 在每个关键点旁标出索引编号（0–20）
   * 文字向右下角偏移 6px，避免与圆点重叠；
   * 加黑色描边以保证在亮色背景下也可读
   * ------------------------------------------------------------------- */
  function drawIndexLabels(landmarks) {
    canvasCtx.font = '13px -apple-system, "Segoe UI", sans-serif';
    canvasCtx.textAlign = 'left';
    canvasCtx.textBaseline = 'top';
    canvasCtx.lineWidth = 3;
    canvasCtx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
    canvasCtx.fillStyle = '#ffd400';
    for (let i = 0; i < landmarks.length; i++) {
      const p = lmToCanvas(landmarks[i]);
      const text = String(i);
      canvasCtx.strokeText(text, p.x + 6, p.y + 6);
      canvasCtx.fillText(text, p.x + 6, p.y + 6);
    }
  }

  /* ---------------------------------------------------------------------
   * 更新顶部状态栏：是否检测到手 + 数量
   * ------------------------------------------------------------------- */
  function updateStatusBar(results) {
    const count = (results.multiHandLandmarks && results.multiHandLandmarks.length) || 0;
    if (count > 0) {
      statusDot.classList.add('active');
      statusText.textContent = '已检测到手';
    } else {
      statusDot.classList.remove('active');
      statusText.textContent = '未检测到手';
    }
    handCountEl.textContent = count;
  }

  /* ---------------------------------------------------------------------
   * 根据真实摄像头分辨率校正 canvas 内部分辨率与容器宽高比
   * ------------------------------------------------------------------- */
  videoElement.addEventListener('loadedmetadata', () => {
    const w = videoElement.videoWidth || CAM_WIDTH;
    const h = videoElement.videoHeight || CAM_HEIGHT;
    canvasElement.width = w;
    canvasElement.height = h;
    canvasWrap.style.aspectRatio = `${w} / ${h}`;
  });

  /* ---------------------------------------------------------------------
   * 启动入口
   * 注意：getUserMedia 要求安全上下文（HTTPS 或 localhost）。
   * 直接用 file:// 打开在部分 Chrome 版本下可能无法访问摄像头，
   * 若遇到权限被拒，建议用本地服务器托管（如 python -m http.server）。
   * ------------------------------------------------------------------- */
  async function main() {
    try {
      statusText.textContent = '加载模型中…';
      initHands();
      await initCamera();
      statusText.textContent = '未检测到手';
    } catch (err) {
      console.error('[启动失败]', err);
      statusText.textContent = '启动失败：' + (err && err.message ? err.message : err);
    }
  }

  main();
  </script>
</body>
</html>
