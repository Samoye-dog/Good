<!-- 注意: TF.js 不再同步加载, 改为按需懒加载 -->
<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0";

// ===== 常量 =====
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];
const FINGERTIPS = new Set([4, 8, 12, 16, 20]);
const NUM_LANDMARKS = 21;

const MP_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const MP_WASM_PATH = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/wasm";

const TFJS_SCRIPTS = [
  "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js",
  "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.22.0/dist/tf-backend-webgpu.min.js",
  "https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js"
];

// ===== DOM =====
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const videoWrap = document.getElementById('videoWrap');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const modelSelect = document.getElementById('modelSelect');
const swapBtn = document.getElementById('swapBtn');
const statusEl = document.getElementById('status');
const cameraInfo = document.getElementById('cameraInfo');
const backendInfo = document.getElementById('backendInfo');
const webgpuInfo = document.getElementById('webgpuInfo');
const fpsEl = document.getElementById('fps');
const handInfo = document.getElementById('handInfo');
const smoothInfo = document.getElementById('smoothInfo');
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');
const loadingProgressFill = document.getElementById('loadingProgressFill');
const loadingDetail = document.getElementById('loadingDetail');
const noHandHint = document.getElementById('noHandHint');
const badgeOverlay = document.getElementById('badgeOverlay');
const badgeText = document.getElementById('badgeText');
const qualityBarFill = document.getElementById('qualityBarFill');

// ===== 状态 =====
let mpHandLandmarker = null;
let tfDetector = null;
let tfBackendName = null;
let stream = null;
let currentFacing = 'user';
let currentModel = 'mediapipe';   // 默认 MediaPipe 单模型 (加载最快)
let swapHand = false;
let isRunning = false;
let isProcessing = false;
let lastVideoTime = -1;
let frameCount = 0;
let lastFpsTime = performance.now();
let webgpuSupported = false;
let mpReady = false;
let tfReady = false;
let tfScriptsLoading = false;

// ===== 进度提示工具 =====
function setProgress(text, percent, detail) {
  loadingText.textContent = text;
  if (typeof percent === 'number') {
    loadingProgressFill.style.width = Math.max(0, Math.min(100, percent)) + '%';
  } else {
    loadingProgressFill.style.width = '0%';
  }
  if (detail !== undefined) loadingDetail.textContent = detail;
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

// 带 XHR 进度的 fetch (用于跟踪大文件下载)
function fetchWithProgress(url, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType = 'arraybuffer';
    xhr.onprogress = (e) => {
      if (e.lengthComputable && onProgress) {
        onProgress(e.loaded, e.total);
      } else if (onProgress) {
        // 没有 lengthComputable, 只显示已下载量
        onProgress(e.loaded, 0);
      }
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve({ buffer: xhr.response, size: xhr.response.byteLength });
      } else {
        reject(new Error('HTTP ' + xhr.status));
      }
    };
    xhr.onerror = () => reject(new Error('Network error'));
    xhr.ontimeout = () => reject(new Error('Timeout'));
    xhr.send();
  });
}

// ===== 1€ 滤波器 =====
class OneEuroFilter {
  constructor(freq = 60, minCutoff = 1.0, beta = 0.05, dCutoff = 1.0) {
    this.freq = freq;
    this.minCutoff = minCutoff;
    this.beta = beta;
    this.dCutoff = dCutoff;
    this.xPrev = null;
    this.dxPrev = 0;
    this.tPrev = null;
  }
  static alpha(cutoff, freq, te) {
    const tau = 1 / (2 * Math.PI * cutoff);
    return 1 / (1 + tau / te);
  }
  filter(x, t) {
    if (this.tPrev === null) {
      this.tPrev = t;
      this.xPrev = x;
      this.dxPrev = 0;
      return x;
    }
    const te = Math.max((t - this.tPrev) / 1000, 1 / this.freq);
    this.tPrev = t;

    const dx = (x - this.xPrev) / te;
    const adx = OneEuroFilter.alpha(this.dCutoff, this.freq, te);
    const dxHat = adx * dx + (1 - adx) * this.dxPrev;

    const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
    const a = OneEuroFilter.alpha(cutoff, this.freq, te);
    const xHat = a * x + (1 - a) * this.xPrev;

    this.xPrev = xHat;
    this.dxPrev = dxHat;
    return xHat;
  }
  reset() {
    this.xPrev = null;
    this.dxPrev = 0;
    this.tPrev = null;
  }
}

let landmarkFilters = [];
function initFilters() {
  landmarkFilters = [];
  for (let i = 0; i < NUM_LANDMARKS; i++) {
    landmarkFilters.push({
      x: new OneEuroFilter(60, 1.2, 0.02),
      y: new OneEuroFilter(60, 1.2, 0.02),
      z: new OneEuroFilter(60, 0.8, 0.01)
    });
  }
}
initFilters();

// ===== 骨骼长度一致性检查 (魔杖场景: 紧握时关节会向内收缩) =====
// 维护每根手指骨骼长度的运行平均, 拒绝严重偏离的帧
let boneLengthBaseline = null;  // { boneIndex: avgLength }
const BONE_INDICES = HAND_CONNECTIONS; // 21 根骨骼
const BONE_DEVIATION_THRESHOLD = 0.45;  // 允许 45% 偏差, 超过则视为低质量
const BONE_LEARNING_RATE = 0.05;  // EMA 学习率

function computeBoneLengths(landmarks) {
  const lengths = {};
  for (let i = 0; i < BONE_INDICES.length; i++) {
    const [a, b] = BONE_INDICES[i];
    const pa = landmarks[a], pb = landmarks[b];
    const dx = pb.x - pa.x, dy = pb.y - pa.y, dz = (pb.z || 0) - (pa.z || 0);
    lengths[i] = Math.sqrt(dx * dx + dy * dy + dz * dz);
  }
  return lengths;
}

// 返回 true 表示该帧骨骼长度合理, false 表示严重偏离 (魔杖紧握时关节收缩)
function validateBoneLengths(landmarks) {
  if (!landmarks || landmarks.length < NUM_LANDMARKS) return false;
  const lengths = computeBoneLengths(landmarks);

  // 第一帧: 初始化 baseline
  if (!boneLengthBaseline) {
    boneLengthBaseline = { ...lengths };
    return true;
  }

  // 检查每根骨骼长度是否在 baseline 的允许范围内
  let maxDeviation = 0;
  let deviationCount = 0;
  for (let i = 0; i < BONE_INDICES.length; i++) {
    const base = boneLengthBaseline[i];
    const cur = lengths[i];
    if (base > 0.001 && cur > 0.001) {
      const dev = Math.abs(cur - base) / base;
      if (dev > BONE_DEVIATION_THRESHOLD) deviationCount++;
      if (dev > maxDeviation) maxDeviation = dev;
    }
  }

  // 如果超过 4 根骨骼严重偏离, 视为低质量帧 (魔杖紧握抖动)
  if (deviationCount > 4) {
    return false;
  }

  // 合理帧: 用 EMA 更新 baseline (适应缓慢的姿态变化)
  for (let i = 0; i < BONE_INDICES.length; i++) {
    boneLengthBaseline[i] = boneLengthBaseline[i] * (1 - BONE_LEARNING_RATE) + lengths[i] * BONE_LEARNING_RATE;
  }
  return true;
}

// ===== 失败保持 =====
let lastValidLandmarks = null;
let lastValidTime = 0;
let lastValidConfidence = 0;
let lastValidModel = '';
const HOLD_DURATION = 500;          // ms (延长到 500ms, 应对魔杖紧握时短暂丢失)
const HOLD_FADE_START = 300;        // ms 之后开始淡出

// ===== WebGPU 检测 =====
async function detectWebGPU() {
  if (!navigator.gpu) return false;
  try {
    const adapter = await navigator.gpu.requestAdapter();
    return !!adapter;
  } catch (e) { return false; }
}

// ===== 按需懒加载 TF.js 脚本 =====
function loadScript(src) {
  return new Promise((resolve, reject) => {
    // 已加载则跳过
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

async function loadTFJSScripts(onProgress) {
  if (window.tf && window.handPoseDetection) return;
  if (tfScriptsLoading) {
    // 等待已有的加载完成
    while (tfScriptsLoading) await new Promise(r => setTimeout(r, 100));
    return;
  }
  tfScriptsLoading = true;
  try {
    for (let i = 0; i < TFJS_SCRIPTS.length; i++) {
      onProgress && onProgress(i, TFJS_SCRIPTS.length);
      await loadScript(TFJS_SCRIPTS[i]);
    }
    onProgress && onProgress(TFJS_SCRIPTS.length, TFJS_SCRIPTS.length);
  } finally {
    tfScriptsLoading = false;
  }
}

// ===== MediaPipe 初始化 (WASM + 模型并行下载) =====
async function initMediaPipe() {
  if (mpReady) return;
  loadingOverlay.classList.add('show');
  setProgress('加载 MediaPipe (WASM + 模型并行下载)...', 5, '');

  // 并行启动 WASM 加载和模型下载
  let modelProgress = { loaded: 0, total: 0 };

  // 模型下载 (带进度)
  const modelPromise = fetchWithProgress(MP_MODEL_URL, (loaded, total) => {
    modelProgress = { loaded, total };
    const pct = total > 0 ? (loaded / total) * 80 : 30;
    setProgress('下载 MediaPipe 模型...', 5 + pct, fmtSize(loaded) + (total > 0 ? ' / ' + fmtSize(total) : ''));
  }).then(r => new Uint8Array(r.buffer)).catch(err => {
    // XHR 失败: 回退到 fetch (无进度)
    console.warn('XHR model download failed, falling back to fetch', err);
    setProgress('下载 MediaPipe 模型 (备用通道)...', 30, '');
    return fetch(MP_MODEL_URL).then(r => r.arrayBuffer()).then(b => new Uint8Array(b));
  });

  // WASM 加载 (MediaPipe 内部处理, 无进度但并行)
  const wasmPromise = FilesetResolver.forVisionTasks(MP_WASM_PATH).then(vision => {
    return vision;
  });

  // 等待模型下载完成
  setProgress('下载 MediaPipe 模型...', 10, '');
  const modelBuffer = await modelPromise;
  setProgress('模型下载完成, 等待 WASM 就绪...', 85, fmtSize(modelBuffer.byteLength));

  // 等待 WASM
  const vision = await wasmPromise;
  setProgress('初始化 HandLandmarker...', 92, '');

  mpHandLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetBuffer: modelBuffer,   // 直接用 buffer, 跳过再次下载
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    // 魔杖场景: 紧握时置信度会跌到 60% 左右, 阈值要够低
    minHandDetectionConfidence: 0.35,
    minHandPresenceConfidence: 0.4,
    minTrackingConfidence: 0.4
  });
  mpReady = true;
  setProgress('就绪', 100, '');
  loadingOverlay.classList.remove('show');
}

// ===== TF.js 初始化 (按需加载脚本 + 模型) =====
async function initTFJS() {
  if (tfReady) return;
  loadingOverlay.classList.add('show');

  // 1. 懒加载 TF.js 脚本 (如果尚未加载)
  if (!window.tf || !window.handPoseDetection) {
    setProgress('懒加载 TF.js 脚本...', 5, '');
    await loadTFJSScripts((loaded, total) => {
      setProgress('加载 TF.js 脚本...', 5 + (loaded / total) * 20, `${loaded}/${total}`);
    });
  }

  // 2. 选择后端
  setProgress('初始化 TF.js 后端...', 30, '');
  if (webgpuSupported) {
    try {
      await tf.setBackend('webgpu');
      await tf.ready();
      tfBackendName = 'webgpu';
    } catch (e) {
      console.warn('WebGPU 初始化失败, 回退到 WebGL', e);
      await tf.setBackend('webgl');
      await tf.ready();
      tfBackendName = 'webgl';
    }
  } else {
    await tf.setBackend('webgl');
    await tf.ready();
    tfBackendName = 'webgl';
  }

  // 3. 创建检测器
  setProgress('加载 TF.js HandPose 模型...', 50, tfBackendName === 'webgpu' ? 'WebGPU' : 'WebGL');
  const model = handPoseDetection.SupportedModels.MediaPipeHands;
  tfDetector = await handPoseDetection.createDetector(model, {
    runtime: 'tfjs',
    maxHands: 2,
    modelType: 'full'
  });
  tfReady = true;
  setProgress('就绪', 100, '');
  loadingOverlay.classList.remove('show');
}

// ===== 摄像头启动 =====
async function startCamera(facing) {
  loadingOverlay.classList.add('show');
  setProgress(facing === 'user' ? '启动前置摄像头...' : '启动后置摄像头...', null, '');

  if (stream) stream.getTracks().forEach(t => t.stop());

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facing },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    canvas.width = video.videoWidth || 1280;
    canvas.height = video.videoHeight || 720;

    currentFacing = facing;
    cameraInfo.textContent = facing === 'user' ? '前置' : '后置';
    cameraInfo.className = 'value';

    if (facing === 'user') {
      videoWrap.classList.add('mirrored');
    } else {
      videoWrap.classList.remove('mirrored');
    }

    loadingOverlay.classList.remove('show');
    return true;
  } catch (e) {
    loadingOverlay.classList.remove('show');
    statusEl.textContent = '启动失败';
    statusEl.className = 'value err';
    alert('无法访问摄像头: ' + e.message);
    return false;
  }
}

// ===== 单模型检测 =====
function detectMediaPipe() {
  if (!mpReady) return null;
  const result = mpHandLandmarker.detectForVideo(video, performance.now());
  if (!result.landmarks || result.landmarks.length === 0) return null;
  const expected = swapHand ? 'Left' : 'Right';
  for (let i = 0; i < result.landmarks.length; i++) {
    const handed = result.handedness[i][0];
    if (handed.categoryName === expected) {
      return { landmarks: result.landmarks[i], confidence: handed.score, model: 'MediaPipe' };
    }
  }
  return null;
}

async function detectTFJS() {
  if (!tfReady) return null;
  const hands = await tfDetector.estimateHands(video, { flipHorizontal: false });
  if (!hands || hands.length === 0) return null;
  const expected = swapHand ? 'Left' : 'Right';
  for (const hand of hands) {
    const label = hand.handedness || 'Right';
    if (label === expected || (label && label.toLowerCase() === expected.toLowerCase())) {
      const landmarks = hand.keypoints.map(p => ({
        x: p.x / canvas.width,
        y: p.y / canvas.height,
        z: p.z || 0
      }));
      return { landmarks, confidence: hand.score || 0.85, model: 'TF.js' };
    }
  }
  return null;
}

// ===== 检测循环 =====
function detectLoop() {
  if (!isRunning) return;

  if (video.readyState >= 2 && video.currentTime !== lastVideoTime && !isProcessing) {
    lastVideoTime = video.currentTime;
    isProcessing = true;
    detectFrame().finally(() => { isProcessing = false; });
  }

  requestAnimationFrame(detectLoop);
}

async function detectFrame() {
  try {
    const now = performance.now();
    let detection = null;
    let usedBackend = '-';
    let boneQuality = 'good';   // good | warn | bad

    if (currentModel === 'mediapipe') {
      if (mpReady) {
        detection = detectMediaPipe();
        usedBackend = 'MP·WebGL';
      }
    } else if (currentModel === 'tfjs') {
      if (tfReady) {
        detection = await detectTFJS();
        usedBackend = tfBackendName === 'webgpu' ? 'TF·WebGPU' : 'TF·WebGL';
      }
    } else {
      // 融合: MediaPipe 主, TF.js 兜底
      if (mpReady) {
        detection = detectMediaPipe();
        usedBackend = 'MP·WebGL';
      }
      if (!detection && tfReady) {
        detection = await detectTFJS();
        if (detection) {
          usedBackend = tfBackendName === 'webgpu' ? 'TF·WebGPU' : 'TF·WebGL';
        } else if (mpReady) {
          usedBackend = 'MP·WebGL';
        }
      }
      if (!mpReady && !tfReady) usedBackend = '-';
    }

    // ===== 魔杖场景: 骨骼长度一致性检查 =====
    if (detection) {
      const isQualityOK = validateBoneLengths(detection.landmarks);
      if (!isQualityOK) {
        // 骨骼长度严重偏离 (魔杖紧握时关节收缩): 视为低质量
        boneQuality = 'bad';
        // 不直接丢弃, 而是降低该帧的置信度, 让保持逻辑接管
        detection.confidence *= 0.4;
      } else if (detection.confidence < 0.7) {
        boneQuality = 'warn';
      }
    }

    // ===== 失败保持 =====
    let displayLandmarks = null;
    let displayConfidence = 0;
    let displayModel = '';
    let isHolding = false;

    if (detection && detection.confidence >= 0.3) {
      // 成功检测: 平滑后输出
      const smoothed = smoothLandmarks(detection.landmarks, now);
      lastValidLandmarks = smoothed;
      lastValidTime = now;
      lastValidConfidence = detection.confidence;
      lastValidModel = detection.model;
      displayLandmarks = smoothed;
      displayConfidence = detection.confidence;
      displayModel = detection.model;
    } else if (detection && lastValidLandmarks && (now - lastValidTime) < HOLD_DURATION) {
      // 当前检测低质量但上次还有效: 保持上一帧
      displayLandmarks = lastValidLandmarks;
      displayConfidence = lastValidConfidence * 0.65;
      displayModel = lastValidModel + '·保持';
      isHolding = true;
    } else if (detection && detection.confidence < 0.3 && lastValidLandmarks && (now - lastValidTime) < HOLD_DURATION) {
      // 当前帧置信度太低: 保持上一帧
      displayLandmarks = lastValidLandmarks;
      displayConfidence = lastValidConfidence * 0.6;
      displayModel = lastValidModel + '·保持';
      isHolding = true;
    } else if (lastValidLandmarks && (now - lastValidTime) < HOLD_DURATION) {
      // 完全丢失: 保持
      displayLandmarks = lastValidLandmarks;
      displayConfidence = lastValidConfidence * 0.7;
      displayModel = lastValidModel + '·保持';
      isHolding = true;
    } else {
      // 长时间丢失: 重置
      if (lastValidLandmarks && (now - lastValidTime) >= HOLD_DURATION) {
        initFilters();
        boneLengthBaseline = null;
        lastValidLandmarks = null;
      }
    }

    if (isRunning) {
      backendInfo.textContent = usedBackend;
      backendInfo.className = 'value';
    }

    drawOverlay(displayLandmarks, displayConfidence, displayModel, isHolding, boneQuality, now);

    // FPS
    frameCount++;
    if (now - lastFpsTime >= 1000) {
      fpsEl.textContent = Math.round(frameCount * 1000 / (now - lastFpsTime));
      frameCount = 0;
      lastFpsTime = now;
    }
  } catch (e) {
    console.error('Detection error:', e);
  }
}

// ===== 1€ 滤波 =====
function smoothLandmarks(landmarks, now) {
  const out = new Array(landmarks.length);
  for (let i = 0; i < landmarks.length; i++) {
    const p = landmarks[i];
    const f = landmarkFilters[i];
    out[i] = {
      x: f.x.filter(p.x, now),
      y: f.y.filter(p.y, now),
      z: f.z.filter(p.z, now)
    };
  }
  return out;
}

// ===== 绘制 =====
function drawOverlay(landmarks, confidence, modelLabel, isHolding, boneQuality, now) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!landmarks) {
    noHandHint.style.display = 'block';
    badgeOverlay.style.display = 'none';
    handInfo.textContent = '未检测';
    handInfo.className = 'value err';
    qualityBarFill.style.width = '0%';
    smoothInfo.textContent = '-';
    smoothInfo.className = 'value';
    return;
  }

  noHandHint.style.display = 'none';
  badgeOverlay.style.display = 'block';
  badgeOverlay.classList.remove('hold', 'warn');
  if (isHolding) badgeOverlay.classList.add('hold');
  else if (boneQuality === 'bad') badgeOverlay.classList.add('warn');

  const pct = Math.max(0, Math.min(100, confidence * 100)).toFixed(0);
  let label = `右手 · ${modelLabel} · ${pct}%`;
  if (isHolding) label += ' (保持)';
  else if (boneQuality === 'bad') label += ' (低质)';
  badgeText.textContent = label;

  handInfo.textContent = `右手 ${pct}%${isHolding ? '·保持' : (boneQuality === 'bad' ? '·低质' : '')}`;
  handInfo.className = 'value' + (isHolding ? ' hold' : (boneQuality === 'bad' ? ' warn' : ''));
  qualityBarFill.style.width = pct + '%';
  smoothInfo.textContent = '1€' + (boneQuality === 'bad' ? '+骨骼' : '');
  smoothInfo.className = 'value';

  const W = canvas.width;
  const H = canvas.height;

  // 保持时淡出
  let alpha = 1.0;
  if (isHolding) {
    const holdTime = now - lastValidTime;
    if (holdTime > HOLD_FADE_START) {
      alpha = Math.max(0.4, 1 - (holdTime - HOLD_FADE_START) / (HOLD_DURATION - HOLD_FADE_START) * 0.6);
    }
  }
  ctx.globalAlpha = alpha;

  // 骨骼连线
  let lineColor, glowColor;
  if (isHolding) {
    lineColor = 'rgba(0, 212, 255, 0.85)';
    glowColor = '#00D4FF';
  } else if (boneQuality === 'bad') {
    lineColor = 'rgba(255, 217, 61, 0.85)';
    glowColor = '#FFD93D';
  } else {
    lineColor = 'rgba(0, 255, 136, 0.9)';
    glowColor = '#00FF88';
  }
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = Math.max(3, W * 0.005);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 12;

  for (const [a, b] of HAND_CONNECTIONS) {
    const p1 = landmarks[a];
    const p2 = landmarks[b];
    ctx.beginPath();
    ctx.moveTo(p1.x * W, p1.y * H);
    ctx.lineTo(p2.x * W, p2.y * H);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // 关键点
  for (let i = 0; i < landmarks.length; i++) {
    const p = landmarks[i];
    const x = p.x * W;
    const y = p.y * H;
    const r = Math.max(4, W * 0.007);

    if (i === 0) {
      ctx.fillStyle = '#FF6B6B';
      ctx.shadowColor = '#FF6B6B';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(x, y, r * 1.4, 0, Math.PI * 2);
      ctx.fill();
    } else if (FINGERTIPS.has(i)) {
      if (isHolding) ctx.fillStyle = '#7FE5FF';
      else if (boneQuality === 'bad') ctx.fillStyle = '#FFEB80';
      else ctx.fillStyle = '#00D4FF';
      ctx.shadowColor = '#00D4FF';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      if (isHolding) ctx.fillStyle = 'rgba(255, 217, 61, 0.7)';
      else if (boneQuality === 'bad') ctx.fillStyle = 'rgba(255, 200, 61, 0.85)';
      else ctx.fillStyle = '#FFD93D';
      ctx.shadowColor = 'rgba(255, 217, 61, 0.6)';
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.85, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1.0;
}

// ===== 事件绑定 =====
startBtn.addEventListener('click', async () => {
  if (isRunning) {
    isRunning = false;
    startBtn.textContent = '启动';
    startBtn.classList.add('primary');
    statusEl.textContent = '已停止';
    statusEl.className = 'value warn';
    if (stream) stream.getTracks().forEach(t => t.stop());
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    fpsEl.textContent = '0';
    handInfo.textContent = '未检测';
    handInfo.className = 'value warn';
    smoothInfo.textContent = '-';
    noHandHint.style.display = 'none';
    badgeOverlay.style.display = 'none';
    qualityBarFill.style.width = '0%';
    lastValidLandmarks = null;
    boneLengthBaseline = null;
    initFilters();
    return;
  }

  startBtn.disabled = true;
  statusEl.textContent = '初始化...';
  statusEl.className = 'value warn';

  if (!webgpuSupported) webgpuSupported = await detectWebGPU();
  webgpuInfo.textContent = webgpuSupported ? '支持' : '不支持';
  webgpuInfo.className = 'value' + (webgpuSupported ? '' : ' warn');

  if (currentModel === 'fusion') {
    await initMediaPipe();
    await initTFJS();
    backendInfo.textContent = 'MP+TF';
    backendInfo.className = 'value';
  } else if (currentModel === 'mediapipe') {
    await initMediaPipe();
    backendInfo.textContent = 'MP·WebGL';
    backendInfo.className = 'value';
  } else {
    await initTFJS();
    backendInfo.textContent = tfBackendName === 'webgpu' ? 'TF·WebGPU' : 'TF·WebGL';
    backendInfo.className = 'value' + (tfBackendName === 'webgpu' ? '' : ' warn');
  }

  const ok = await startCamera(currentFacing);
  startBtn.disabled = false;

  if (ok) {
    isRunning = true;
    startBtn.textContent = '停止';
    startBtn.classList.remove('primary');
    statusEl.textContent = '运行中';
    statusEl.className = 'value';
    switchBtn.disabled = false;
    detectLoop();
  } else {
    statusEl.textContent = '启动失败';
    statusEl.className = 'value err';
  }
});

switchBtn.addEventListener('click', async () => {
  if (!isRunning) return;
  const next = currentFacing === 'user' ? 'environment' : 'user';
  await startCamera(next);
  initFilters();
  boneLengthBaseline = null;
  lastValidLandmarks = null;
});

modelSelect.addEventListener('change', async (e) => {
  const newModel = e.target.value;
  if (newModel === currentModel) return;

  const wasRunning = isRunning;
  isRunning = false;
  currentModel = newModel;

  if (wasRunning) {
    statusEl.textContent = '切换模型...';
    statusEl.className = 'value warn';
    if (newModel === 'fusion') {
      await initMediaPipe();
      await initTFJS();
      backendInfo.textContent = 'MP+TF';
      backendInfo.className = 'value';
    } else if (newModel === 'mediapipe') {
      await initMediaPipe();
      backendInfo.textContent = 'MP·WebGL';
      backendInfo.className = 'value';
    } else {
      await initTFJS();
      backendInfo.textContent = tfBackendName === 'webgpu' ? 'TF·WebGPU' : 'TF·WebGL';
      backendInfo.className = 'value' + (tfBackendName === 'webgpu' ? '' : ' warn');
    }
    initFilters();
    boneLengthBaseline = null;
    lastValidLandmarks = null;
    isRunning = true;
    statusEl.textContent = '运行中';
    statusEl.className = 'value';
    detectLoop();
  }
});

swapBtn.addEventListener('click', () => {
  swapHand = !swapHand;
  swapBtn.classList.toggle('active', swapHand);
  swapBtn.title = swapHand
    ? '当前过滤: Left 标签 (点击恢复 Right)'
    : '当前过滤: Right 标签 (点击互换为 Left)';
  initFilters();
  boneLengthBaseline = null;
  lastValidLandmarks = null;
});

// 初始 WebGPU 检测
(async () => {
  webgpuSupported = await detectWebGPU();
  webgpuInfo.textContent = webgpuSupported ? '支持' : '不支持';
  webgpuInfo.className = 'value' + (webgpuSupported ? '' : ' warn');
})();
</script>
